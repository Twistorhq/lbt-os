# Prepared by Twistor Holdings LLC
# TW-488: lbt-os backend on Fly.io free tier ($0).
# TW-1322: app renamed to twistor-trades-backend. The old name,
# lbt-os-backend, is registered to a third party (Fly API returns 403
# for it; it is NOT ours to reclaim). twistor-trades-backend returned
# 404 (unclaimed) on 2026-11-24 and is not in our org's app list.
# Deploy: flyctl launch --no-deploy (first time) then flyctl deploy
# Secrets: flyctl secrets set KEY=value (see docs/deploy-package-tw1322.md)

app = "twistor-trades-backend"
primary_region = "den"  # Denver — closest to home

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Free-tier friendly: sleep when idle, wake on request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[env]
  APP_ENV = "production"
