# Prepared by Twistor Holdings LLC
#
# Production deploy for the Twistor Trades site (Twistorhq/lbt-os).
# Manual-only: production rebuilds happen when Justynn says so, never on push.
# The Clerk publishable key is injected at build time from the
# VITE_CLERK_PUBLISHABLE_KEY repo secret — no human ever hands a key to an agent.
#
# First-use note: the repo's Pages "Build and deployment" source must be
# switched from the gh-pages branch to "GitHub Actions" before this workflow's
# first run (repo Settings > Pages). After that, gh-pages branch pushes stop.

name: Deploy Pages (production)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time; a newer manual run supersedes a queued one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check Clerk publishable key is set
        # Rosa's TW-236 finding: without VITE_CLERK_PUBLISHABLE_KEY the build
        # silently tree-shakes the entire app out of the bundle (degenerate
        # ~375KB vendor-only output, blank page on load). Fail loudly here
        # instead of shipping that.
        run: |
          if [ -z "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY repo secret is missing or empty. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Matches the repo's CI frontend job.
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build -- --base=/lbt-os/
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Verify bundle is not degenerate
        # Belt and suspenders behind the key guard above: a healthy production
        # bundle is ~1MB+ and contains app strings. Refuse to deploy otherwise.
        run: |
          BUNDLE=$(ls dist/assets/*.js | head -1)
          SIZE=$(stat -c%s "$BUNDLE")
          echo "bundle=$BUNDLE size=$SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::Built JS bundle is suspiciously small ($SIZE bytes) — likely the degenerate tree-shaken bundle. Refusing to deploy."
            exit 1
          fi
          if ! grep -q "Twistor Trades" "$BUNDLE"; then
            echo "::error::Built bundle is missing app strings. Refusing to deploy."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
